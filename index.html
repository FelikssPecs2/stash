<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>STASH - Ieiešana</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card" style="width: 350px; margin: 100px auto;">
        <h2>STASH Ieiešana</h2>
        <form id="login-form">
            <input type="text" id="username" placeholder="Lietotājvārds" required>
            <input type="password" id="password" placeholder="Parole" required>
            <button type="submit">Pieslēgties</button>
        </form>
        <p id="error-msg" style="color: red; margin-top: 10px;"></p>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
